name: data

# كل 30 دقيقة: جمع + تقليص + نشر في فرع data
# (GitHub cron غير دقيق؛ قد يتأخر 5–20 دقيقة وقت الذروة)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions
  push:
    branches: [main]
    paths:                    # لا تُشغّل عند تغيير ملفات التطبيق فقط
      - "collector.py"
      - "tester.py"
      - "server/**"
      - ".github/workflows/data.yml"

# لا تشغّل دورتين في وقت واحد
concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TEST_TOP: "1200"        # عدد الكانفيغات المفحوصة فعليًا (عيّنة متوازنة)
      CONCURRENCY: "40"       # عمليات الفحص المتوازية
      TEST_TIMEOUT: "5"
      BEST_N: "100"
      MAX_PER_HOST: "3"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data (scrape + test + publish files)
        env:
          PUBLIC_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@data
        run: python server/build_data.py

      - name: Show summary
        if: always()
        run: |
          echo "### نتيجة الدورة" >> $GITHUB_STEP_SUMMARY
          if [ -f dist/meta.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          m = json.load(open("dist/meta.json"))
          print(f"- **وقت التوليد:** {m['generated_at']}  ({m['duration_sec']}s)")
          print(f"- **القنوات:** {m['channels_ok']}/{m['channels_total']} ناجحة")
          print(f"- **جُمع:** {m['raw_collected']} → **نظيف:** {m['unique_clean']}")
          print(f"- **فُحص:** {m['tested']} → **حيّ:** {m['alive']}")
          print(f"- **البروتوكولات الحيّة:** {m['alive_by_protocol']}")
          PY
          else
            echo "لا يوجد meta.json — فشلت الدورة قبل إنتاج الملفات."
          fi

      - name: Publish to data branch (single commit, force push)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=/tmp/publish && rm -rf "$OUT" && mkdir -p "$OUT"
          cp -r dist/. "$OUT"/

          # ملف تعريفي صغير لروابط jsDelivr
          cat > "$OUT/README.md" <<'EOF'
          # data — مخرجات مولّدة آليًا

          لا تعدّل هذا الفرع يدويًا. يُعاد كتابته بالكامل كل 30 دقيقة من `.github/workflows/data.yml`.

          | الملف | الوصف |
          |---|---|
          | `alive.txt` | الكانفيغات الحيّة فقط (سطر لكل كانفيغ) |
          | `alive.json` | نفس القائمة + تأخير/محرّك (لعرضها في التطبيق) |
          | `sub.txt` | نفس القائمة بترميز base64 (اشتراك) |
          | `best100.txt` | أفضل 100 حسب قياس الخادم |
          | `all.txt.gz` | كل الكانفيغات النظيفة مضغوطة |
          | `meta.json` | وقت التوليد والأعداد |

          روابط سريعة عبر jsDelivr:
          `https://cdn.jsdelivr.net/gh/OWNER/REPO@data/alive.txt`
          EOF

          cd "$OUT"
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # إن لم يتغيّر شيء، لا داعي للدفع
          if git diff --cached --quiet 2>/dev/null; then
            echo "لا تغييرات جوهرية؟ (فرع جديد دائمًا له commit)"
          fi
          git commit -q -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') | $(python -c "import json;print(json.load(open('meta.json'))['alive'])" 2>/dev/null || echo '?') alive"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
          echo "نُشر بنجاح → https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/meta.json"

      - name: Purge jsDelivr cache
        if: success()
        run: |
          for f in alive.txt alive.json sub.txt best100.txt meta.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" > /dev/null || true
          done
          echo "تم إرسال طلبات تحديث الكاش."
