name: apk

# يبني APK عند كل تعديل على مجلد android/ أو يدويًا
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write        # لنشر الإصدار (Release) عند وضع tag

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # النواة تُنزَّل هنا ولا تُخزَّن في git (79MB)
      - name: Fetch sing-box engine (arm64 + x86_64)
        working-directory: android
        run: bash scripts/fetch-engines.sh --all

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Build release APK (unsigned)
        working-directory: android
        run: gradle --no-daemon assembleRelease
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-configs-apk
          path: out/*.apk
          retention-days: 14

      - name: Attach to release (إذا كان الوسم v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
