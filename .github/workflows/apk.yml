name: apk

# يبني ويختبر ويوقّع كلاً من تطبيق المشترك (User APK) وتطبيق المشرف المستقل (Admin APK)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.7"

      - name: Cache native VPN engines (sing-box + hev-socks5-tunnel)
        id: cache-sbx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            android/app/src/main/jniLibs
            android/app/libs
          key: engines-sb1.14.4-hev2.19.3-sha256-v2

      - name: Fetch & verify native engines (arm64 + x86_64 + hev-socks5-tunnel AAR)
        if: steps.cache-sbx.outputs.cache-hit != 'true'
        working-directory: android
        run: bash scripts/fetch-engines.sh --all

      - name: Prepare Release Signing Keystore (GitHub Secret or RSA-4096 Production Certificate)
        env:
          SECRET_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_ALT_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_B64="${SECRET_KS_B64:-${SECRET_KS_ALT_B64:-}}"
          if [ -n "$KS_B64" ] && [ -n "${SECRET_KS_PASS:-}" ] && [ -n "${SECRET_KEY_ALIAS:-}" ]; then
            KS_FILE="${RUNNER_TEMP}/release-signing.keystore"
            printf '%s' "$KS_B64" | tr -d ' \t\r\n' | base64 -d > "$KS_FILE"
            chmod 600 "$KS_FILE"
            EFF_KEY_PASS="${SECRET_KEY_PASS:-$SECRET_KS_PASS}"
            echo "KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EFF_KEY_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=PERSISTENT_SECRET_KEYSTORE" >> "$GITHUB_ENV"
          else
            KS_FILE="${RUNNER_TEMP}/release-signing.p12"
            RAND_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$RAND_PASS"
            keytool -genkeypair -noprompt \
              -storetype PKCS12 \
              -keystore "$KS_FILE" \
              -storepass "$RAND_PASS" \
              -keypass "$RAND_PASS" \
              -alias "bahrain_vpn_release" \
              -keyalg RSA \
              -keysize 4096 \
              -sigalg SHA256withRSA \
              -validity 9125 \
              -dname "CN=Bahrain VPN Release, OU=Mobile Security, O=Bahrain VPN, L=Manama, C=BH" >/dev/null 2>&1
            chmod 600 "$KS_FILE"
            echo "KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$RAND_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=bahrain_vpn_release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RAND_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=RSA4096_RELEASE_CERT" >> "$GITHUB_ENV"
          fi

      - name: Run Android unit tests (:app + :admin) & build signed release APKs
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon :app:testReleaseUnitTest :admin:testReleaseUnitTest :app:assembleRelease :admin:assembleRelease 2>&1 | tee gradle.log || {
            grep -vE '^> Task ' gradle.log | grep -E '(^e: |FAILURE:|What went wrong:|FAILED|AssertionError|Exception)' | head -n 8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = fails = errs = 0
          for pattern in ("app/build/test-results/testReleaseUnitTest/*.xml", "admin/build/test-results/testReleaseUnitTest/*.xml"):
              for p in glob.glob(pattern):
                  r = ET.parse(p).getroot()
                  total += int(r.attrib.get("tests", 0))
                  fails += int(r.attrib.get("failures", 0))
                  errs += int(r.attrib.get("errors", 0))
          print(f"::notice::Android JUnit Suite (:app + :admin): {total} tests executed, {fails} failures, {errs} errors")
          assert total >= 15 and fails == 0 and errs == 0
          PY

      - name: Collect User & Admin APKs, compute SHA-256 & run security/resource audits
        run: |
          mkdir -p out
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          if [ -f out/app-universal-release.apk ] && [ ! -f out/app-release.apk ]; then
            cp out/app-universal-release.apk out/app-release.apk
          fi
          ADMIN_SRC=$(find android/admin/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$ADMIN_SRC" ] || [ ! -f "$ADMIN_SRC" ]; then
            echo "::error::Missing compiled Admin Release APK!"
            exit 1
          fi
          cp "$ADMIN_SRC" out/app-admin-release.apk

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          for apk_file in out/*.apk; do
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "env:KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "env:KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk_file"
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt)

          USER_BADGING=$("$AAPT2" dump badging out/app-arm64-v8a-release.apk | head -n 1)
          ADMIN_BADGING=$("$AAPT2" dump badging out/app-admin-release.apk | head -n 1)

          if "$AAPT2" dump permissions out/app-arm64-v8a-release.apk | grep -q "REQUEST_INSTALL_PACKAGES"; then
            echo "::error::Play Protect Dropper Trigger: REQUEST_INSTALL_PACKAGES found in User APK!"
            exit 1
          fi
          if "$AAPT2" dump permissions out/app-admin-release.apk | grep -q "REQUEST_INSTALL_PACKAGES"; then
            echo "::error::Play Protect Dropper Trigger: REQUEST_INSTALL_PACKAGES found in Admin APK!"
            exit 1
          fi

          USER_SIG_INFO=$("$APKSIGNER" verify --min-sdk-version 24 --verbose --print-certs out/app-arm64-v8a-release.apk)
          ADMIN_SIG_INFO=$("$APKSIGNER" verify --min-sdk-version 24 --verbose --print-certs out/app-admin-release.apk)
          if echo "$USER_SIG_INFO" | grep -qi "Android Debug"; then
            echo "::error::User Release APK must NOT be signed with Android Debug certificate!"
            exit 1
          fi
          if echo "$ADMIN_SIG_INFO" | grep -qi "Android Debug"; then
            echo "::error::Admin Release APK must NOT be signed with Android Debug certificate!"
            exit 1
          fi
          if ! echo "$USER_SIG_INFO" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"; then
            echo "::error::User Release APK missing v2 signature scheme!"
            exit 1
          fi
          if ! echo "$USER_SIG_INFO" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"; then
            echo "::error::User Release APK missing v3 signature scheme!"
            exit 1
          fi
          CERT_SHA256=$(echo "$USER_SIG_INFO" | sed -n 's/.*certificate SHA-256 digest: \([0-9a-fA-F]*\).*/\1/p' | head -n 1)

          if "$AAPT2" dump strings out/app-arm64-v8a-release.apk | grep -iE "oldman-552|vpn-configs|githubusercontent|jsdelivr"; then
            echo "::error::Repository details leaked into User APK resources.arsc!"
            exit 1
          fi
          if "$AAPT2" dump xmltree out/app-arm64-v8a-release.apk --file AndroidManifest.xml | grep -iE "oldman-552|vpn-configs|githubusercontent|jsdelivr"; then
            echo "::error::Repository details leaked into User APK AndroidManifest.xml!"
            exit 1
          fi
          python3 - <<'PY'
          import glob, os, re, subprocess, sys, zipfile
          try:
              apk = "out/app-arm64-v8a-release.apk"
              leak_re = re.compile(rb"(oldman-552|vpn-configs|githubusercontent\.com|jsdelivr\.net)", re.I)
              secret_re = re.compile(rb"(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|ENTERPRISE_MASTER_KEY)", re.I)
              dropper_re = re.compile(r"(application/vnd\.android\.package-archive|REQUEST_INSTALL_PACKAGES)", re.I)
              non_dex_leaks = []
              dex_hits = 0
              with zipfile.ZipFile(apk) as zf:
                  entries = zf.namelist()
                  for name in entries:
                      if name.startswith("lib/"):
                          continue
                      data = zf.read(name)
                      if secret_re.search(data):
                          raise RuntimeError(f"Embedded secret detected inside {name}!")
                      if name.endswith(".dex"):
                          if leak_re.search(data):
                              dex_hits += 1
                      else:
                          m = leak_re.search(data)
                          if m:
                              non_dex_leaks.append(f"{name}:{m.group(0).decode('latin1')}")
              if non_dex_leaks:
                  raise RuntimeError("Non-DEX APK resource/asset leak: " + ", ".join(non_dex_leaks))
              class_files = glob.glob("android/app/build/tmp/kotlin-classes/release/com/bahrain/vpnconfigs/**/*.class", recursive=True)
              ui_class_leaks = []
              dropper_leaks = []
              repo_saw_owner = False
              repo_saw_cdn = False
              str_leak_re = re.compile(r"(oldman-552|vpn-configs|githubusercontent\.com|jsdelivr\.net|best100\.txt|alive\.json)", re.I)
              for cf in class_files:
                  rel = os.path.relpath(cf, "android/app/build/tmp/kotlin-classes/release")
                  raw_out = subprocess.check_output(["javap", "-v", cf], text=True, errors="ignore")
                  out = "\n".join(l for l in raw_out.splitlines() if not l.strip().startswith("Classfile "))
                  dm = dropper_re.search(out)
                  if dm:
                      dropper_leaks.append(f"{rel}->{dm.group(0)}")
                  if rel.startswith("com/bahrain/vpnconfigs/data/Repo"):
                      if "oldman-552" in out:
                          repo_saw_owner = True
                      if "jsdelivr.net" in out:
                          repo_saw_cdn = True
                      continue
                  if rel.startswith("com/bahrain/vpnconfigs/util/UiMessages"):
                      continue
                  if any(rel.startswith(p) for p in (
                      "com/bahrain/vpnconfigs/ui/",
                      "com/bahrain/vpnconfigs/MainActivity",
                      "com/bahrain/vpnconfigs/vpn/",
                      "com/bahrain/vpnconfigs/data/Prefs",
                      "com/bahrain/vpnconfigs/enterprise/",
                  )):
                      m = str_leak_re.search(out)
                      if m:
                          ui_class_leaks.append(f"{rel}->{m.group(0)}")
              if dropper_leaks:
                  raise RuntimeError("Play Protect Dropper bytecode leak: " + ", ".join(dropper_leaks[:5]))
              if ui_class_leaks:
                  raise RuntimeError("UI/Enterprise bytecode leak: " + ", ".join(ui_class_leaks[:5]))
              if not (repo_saw_owner and repo_saw_cdn and dex_hits >= 1):
                  raise RuntimeError(f"Operational Repo endpoints check: owner={repo_saw_owner} cdn={repo_saw_cdn} dex_hits={dex_hits}")

              # Also audit Admin APK for zero hardcoded tokens/passphrases
              with zipfile.ZipFile("out/app-admin-release.apk") as azf:
                  for name in azf.namelist():
                      if secret_re.search(azf.read(name)):
                          raise RuntimeError(f"Hardcoded secret found in Admin APK {name}!")

              print(f"::notice::Release APK Audit PASS | user_entries={len(entries)} app_classes={len(class_files)} non_dex_leaks=0 ui_bytecode_leaks=0 zero_dropper=True admin_apk_verified=True dex_with_network_consts={dex_hits}")
          except Exception as exc:
              print(f"::error::APK Audit failed: {exc}")
              sys.exit(1)
          PY
          echo "::notice::Signing Mode: ${SIGNING_MODE:-UNKNOWN} | Cert SHA-256: ${CERT_SHA256:-N/A}"
          echo "::notice::User APK Badging: $USER_BADGING"
          echo "::notice::Admin APK Badging: $ADMIN_BADGING"
          SHA_SUMMARY=$(tr '\n' ';' < out/SHA256SUMS.txt)
          echo "::notice::SHA256: $SHA_SUMMARY"
          ls -lh out/
          cat out/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bahrain-configs-apk
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30

      - name: Publish User & Admin APKs to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)
          VER_TAG="v${VER_NAME:-3.5}"
          NOTES="منصة **ULTIMATE VPN ENTERPRISE (${VER_TAG})** المتكاملة — تشمل معمارية **Central GitHub Top 500 + Local Android Personalized Top 50** المنفصلة لشبكتي \`Wi-Fi\` و\`Mobile Data\`، التوافق الأمني الكامل مع **Google Play Protect** (إزالة صلاحية وكود \`REQUEST_INSTALL_PACKAGES / Dropper\` وتوقيع إصدار \`RSA-4096 APK Signature v2/v3\` بدل شهادة \`Debug\`)، الفحص التسلسلي عبر النفق الحقيقي (\`Quick Scan\` / \`Full Scan\`)، تقليص الحجم عبر \`R8\`، التحديث الآمن عبر المتصفح حسب المعمارية (\`arm64-v8a\` / \`x86_64\`)، عُقد **VIP المشفّرة (\`AES-256-GCM\`)**، مفتاح الإيقاف الصارم، وتطبيق المشرف المستقل \`app-admin-release.apk\`."

          publish_release() {
            local tag="$1"
            local title="$2"
            local latest_flag="$3"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null 2>&1 || true
              gh release upload "$tag" out/*.apk out/SHA256SUMS.txt --clobber
              gh release edit "$tag" --title "$title" --notes "$NOTES" "$latest_flag"
            else
              gh release create "$tag" out/*.apk out/SHA256SUMS.txt \
                --target "${GITHUB_SHA}" \
                --title "$title" \
                --notes "$NOTES" \
                "$latest_flag"
            fi
          }

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if gh release view "latest-apk" >/dev/null 2>&1; then
              gh release delete-asset "latest-apk" "app-debug.apk" --yes >/dev/null 2>&1 || true
            fi
            publish_release "latest-apk" "bahrain-vpn ${VER_TAG} (latest-apk)" "--latest=false"
            publish_release "${VER_TAG}" "bahrain-vpn ${VER_TAG}" "--latest"
            echo "::notice::Published tags: ${VER_TAG} (Latest) and latest-apk -> ${GITHUB_SHA}"
          else
            publish_release "${GITHUB_REF_NAME}" "bahrain-vpn ${GITHUB_REF_NAME}" "--latest"
            echo "::notice::Published tag: ${GITHUB_REF_NAME} -> ${GITHUB_SHA}"
          fi

      - name: Securely wipe temporary release keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}"/release-signing.* || true
