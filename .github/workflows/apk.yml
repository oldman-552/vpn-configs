name: apk

# يبني APK عند كل تعديل على مجلد android/ أو في طلبات الدمج أو يدويًا
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache sing-box Android binaries
        id: cache-sbx
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: singbox-android-1.14.4-v1

      - name: Fetch sing-box engine (arm64 + x86_64)
        if: steps.cache-sbx.outputs.cache-hit != 'true'
        working-directory: android
        run: bash scripts/fetch-engines.sh --all

      - name: Build debug & signed release APKs
        working-directory: android
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-configs-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" = "main" ]; then
            TAG="latest-apk"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk \
              --title "Bahrain Configs APK ($TAG)" \
              --notes "تطبيق أندرويد جاهز للتثبيت المباشر (مضبوط تلقائيًا على المستودع \`${GITHUB_REPOSITORY}\`). ثبّت \`app-release.apk\` مباشرة على هاتفك."
          fi
