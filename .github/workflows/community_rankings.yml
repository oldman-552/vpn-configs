name: community-rankings

# كل ساعتين: سحب تقارير الفحص المجتمعي الموثّقة (إيران IR وبقية الدول) وتحديث قوائم @data
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore current data branch snapshot
        run: |
          mkdir -p data_work
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive origin/data | tar -x -C data_work
          else
            echo "::notice::No data branch yet — skipping standalone community sync until initial data build."
            exit 0
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync & compute multi-device trust-scored community rankings (Iran IR + Countries)
        if: hashFiles('data_work/alive.json') != ''
        env:
          COMMUNITY_WORKER_URL: ${{ secrets.COMMUNITY_WORKER_URL }}
          COMMUNITY_EXPORT_TOKEN: ${{ secrets.COMMUNITY_EXPORT_TOKEN }}
        run: |
          python server/sync_community_rankings.py --data-dir data_work --prev-dir data_work
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path("data_work")
          for req in (
              "iran-top500.json", "iran-top500.txt", "iran-results.json",
              "germany-top500.json", "france-top500.json",
              "turkey-top500.json", "russia-top500.json",
          ):
              p = d / req
              assert p.is_file() and p.stat().st_size > 0, f"Missing community artifact: {req}"
          ir = json.loads((d / "iran-top500.json").read_text(encoding="utf-8"))
          assert ir["country_code"] == "IR" and 0 <= ir["qualified_count"] <= 500
          PY

      - name: Publish updated community rankings to data branch
        if: success() && hashFiles('data_work/iran-top500.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd data_work
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH_B64}"
          git add -A
          git commit -q -m "community-rankings: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" data:data
          git config --local --unset-all "http.https://github.com/.extraheader" || true

      - name: Purge jsDelivr cache for community feeds
        if: success() && hashFiles('data_work/iran-top500.json') != ''
        run: |
          for f in iran-top500.json iran-top500.txt iran-results.json germany-top500.json france-top500.json turkey-top500.json russia-top500.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" > /dev/null || true
          done
