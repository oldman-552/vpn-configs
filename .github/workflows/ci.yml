name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml

      - name: Run unit, security & pipeline test suite
        run: pytest -v

      - name: Web admin — syntax, CSP and event dispatcher
        run: |
          for jsf in web-admin/*.js web-admin/modules/*.js community-worker/worker.js; do node --check "$jsf"; done
          if grep -rnE '\son(click|change|input|submit|load|error|key[a-z]+|mouse[a-z]+)=' web-admin; then
            echo "Inline event handlers are blocked by CSP; use data-on (see web-admin/events.js)"; exit 1
          fi
          grep -q "script-src 'self';" web-admin/index.html
          grep -q "script-src 'self';" web-admin/monitor.html
          node tests/web/events_dispatch_test.js

      - name: Validate GitHub Actions workflow schemas & SHA pinning
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml

          wf_dir = Path(".github/workflows")
          for wf in sorted(wf_dir.glob("*.yml")):
              doc = yaml.safe_load(wf.read_text(encoding="utf-8"))
              assert isinstance(doc, dict) and "jobs" in doc, f"Invalid workflow: {wf}"
              assert "permissions" in doc, f"Missing top-level permissions in {wf}"
              for line in wf.read_text(encoding="utf-8").splitlines():
                  s = line.strip()
                  if s.startswith("uses:") or s.startswith("- uses:"):
                      ref = s.split("uses:", 1)[1].split("#", 1)[0].strip()
                      assert re.search(r"@[0-9a-f]{40}$", ref), f"Unpinned action in {wf}: {ref}"
          print("All workflow schemas and 40-char commit SHA pins verified.")
          PY
