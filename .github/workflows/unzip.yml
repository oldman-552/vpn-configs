name: Extract ZIP to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import shutil

          archive = Path("2.zip")
          temp = Path("/tmp/zip-extracted")
          temp.mkdir(exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (temp / item.filename).resolve()
                  if not target.is_relative_to(temp.resolve()):
                      raise ValueError("Unsafe ZIP path")
              z.extractall(temp)

          items = list(temp.iterdir())

          if len(items) == 1 and items[0].is_dir():
              source = items[0]
          else:
              source = temp

          for item in source.iterdir():
              if item.name == ".git":
                  continue
              destination = Path(item.name)
              if destination.exists():
                  print(f"Skipped existing: {item.name}")
                  continue
              shutil.move(str(item), str(destination))

          print("Extraction completed.")
          PY

      - name: Save extracted files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Extract ZIP files into main"
            git push origin HEAD:main
          fi
