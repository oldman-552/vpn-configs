name: enterprise

# يشغّل اختبارات المنصة المؤسسية، ينشر لوحة الويب (17 صفحة) على GitHub Pages، وينفّذ النسخ الاحتياطي المشفّر
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"
  pull_request:
    paths:
      - "enterprise/**"
      - "web-admin/**"
      - "tests/**"
      - ".github/workflows/enterprise.yml"
  push:
    branches: [main]
    paths:
      - "enterprise/**"
      - "web-admin/**"
      - "tests/**"
      - ".github/workflows/enterprise.yml"

permissions:
  contents: read

concurrency:
  group: enterprise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies & run enterprise test suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyyaml
          pytest -v

      - name: Verify 17-Page Modular Web Admin Dashboard syntax & security
        run: |
          for jsf in web-admin/*.js web-admin/modules/*.js; do
            node --check "$jsf"
          done
          python - <<'PY'
          import re
          from pathlib import Path

          combined_js = "\n".join(
              p.read_text(encoding="utf-8")
              for p in sorted(Path("web-admin").rglob("*.js"))
          )
          expected_pages = [
              "overview", "users", "subscriptions", "devices", "sessions",
              "servers", "health", "speeds", "netdiag", "crashes",
              "ai", "notifications", "remote_config", "updates", "audit",
              "admins", "settings",
          ]
          for pid in expected_pages:
              assert f'id: "{pid}"' in combined_js, f"Missing Web Admin page: {pid}"

          secret_re = re.compile(r"(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})")
          for p in Path("web-admin").rglob("*"):
              if p.is_file():
                  assert not secret_re.search(p.read_text(encoding="utf-8")), f"Hardcoded token in {p}"
          print("::notice::Web Admin Audit PASS: 17/17 modular pages verified, JS syntax clean, 0 hardcoded secrets")
          PY

      - name: Deploy 17-Page Web Admin Dashboard to gh-pages branch
        if: success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAGES_OUT=/tmp/gh_pages && rm -rf "$PAGES_OUT" && mkdir -p "$PAGES_OUT"
          cp -r web-admin/. "$PAGES_OUT"/
          cd "$PAGES_OUT"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH_B64}"
          git add -A
          git commit -q -m "gh-pages: deploy ULTIMATE VPN ENTERPRISE Web Admin ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          echo "::notice::Deployed Web Admin Dashboard to gh-pages branch"
