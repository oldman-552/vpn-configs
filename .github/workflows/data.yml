name: data

# كل 30 دقيقة: جمع محصّن + فحص متعدّد الجولات + استقرار طولي + نشر آمن في فرع data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "tester.py"
      - "dedupe.py"
      - "scoring.py"
      - "pipeline_security.py"
      - "security_intelligence.py"
      - "historical_db.py"
      - "central_top500.py"
      - "community_ranking.py"
      - "migrations/**"
      - "public_api.py"
      - "channels.txt"
      - "github_sources.txt"
      - "requirements.txt"
      - "server/**"
      - ".github/workflows/data.yml"

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    env:
      TEST_TOP: "1200"
      SPEED_TOP: "150"
      CONCURRENCY: "40"
      TEST_TIMEOUT: "5"
      BEST_N: "100"
      MAX_PER_HOST: "3"
      MIN_ALIVE: "5"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore previous data snapshot (longitudinal state & last-known-good fallback)
        run: |
          mkdir -p prev_dist
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive origin/data | tar -x -C prev_dist || true
            echo "Restored previous data snapshot ($(ls -1 prev_dist | wc -l) entries)."
          else
            echo "No prior data branch found — starting fresh."
          fi

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Xray & sing-box binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: engines-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data (collect + 5-layer dedupe + multi-stage validate + rank)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@data
          PREV_DIST: prev_dist
          COMMUNITY_WORKER_URL: ${{ secrets.COMMUNITY_WORKER_URL }}
          COMMUNITY_EXPORT_TOKEN: ${{ secrets.COMMUNITY_EXPORT_TOKEN }}
          TOP500_SIGNING_KEY_B64: ${{ secrets.TOP500_SIGNING_KEY_B64 }}
        run: |
          python server/build_data.py --prev-dir prev_dist
          mkdir -p dist/enterprise
          if [ -d prev_dist/enterprise ]; then
            cp -r prev_dist/enterprise/. dist/enterprise/
          fi
          NEEDS_BUNDLE=0
          if [ ! -f dist/enterprise/bundle.json ]; then
            NEEDS_BUNDLE=1
          elif [ ! -f dist/enterprise/vault.enc.json ] && [ ! -f dist/enterprise/vault_sqlite.enc.json ]; then
            if ! python -c 'import json,sys; sys.exit(0 if json.load(open("dist/enterprise/bundle.json",encoding="utf-8")).get("bundle",{}).get("bundle_release")=="2.0" else 1)' 2>/dev/null; then
              NEEDS_BUNDLE=1
            fi
          fi
          if [ "$NEEDS_BUNDLE" = "1" ]; then
            python -m enterprise.publisher \
              --vault dist/enterprise/vault_sqlite.enc.json \
              --alive dist/alive.json \
              --bundle-out dist/enterprise/bundle.json \
              --backup-dir dist/enterprise/backups
          fi

      - name: Verify generated artifacts before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dist = Path("dist")
          for req in (
              "alive.txt", "best100.txt", "sub.txt", "alive.json",
              "top500.json", "top500.txt", "top500.manifest.json",
              "iran-top500.json", "iran-top500.txt", "iran-results.json",
              "germany-top500.json", "france-top500.json",
              "turkey-top500.json", "russia-top500.json",
              "meta.json", "source_health.json", "quarantined.json",
              "servers-current.json", "servers-history.json",
              "servers-performance.json", "servers-statistics.json",
              "countries-statistics.json", "sources-statistics.json",
              "api/v1/health.json", "api/v1/statistics.json",
              "api/v1/servers.json", "api/v1/openapi.json",
          ):
              p = dist / req
              assert p.is_file() and p.stat().st_size > 0, f"Missing or empty artifact: {req}"
          t500 = json.loads((dist / "top500.json").read_text(encoding="utf-8"))
          assert 0 <= t500.get("qualified_count", -1) <= 500, "Invalid top500 qualified_count!"
          assert t500.get("personalized_top50_authority") == "ANDROID_LOCAL_ONLY", "Authority boundary violated!"
          meta = json.loads((dist / "meta.json").read_text(encoding="utf-8"))
          if not meta.get("degraded_mode", False):
              gz = dist / "all.txt.gz"
              assert gz.is_file() and gz.stat().st_size > 0, "Missing or empty all.txt.gz"
          alive_j = json.loads((dist / "alive.json").read_text(encoding="utf-8"))
          assert alive_j.get("count", 0) >= 1 and len(alive_j.get("servers", [])) >= 1, "Empty alive.json servers!"
          print(f"Verified dist/ artifacts: alive={alive_j['count']}, degraded={meta.get('degraded_mode', False)}")
          PY

      - name: Show summary
        if: always()
        run: |
          echo "### نتيجة الدورة" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/meta.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("dist/meta.json", encoding="utf-8"))
          print(f"- **وقت التوليد:** {m.get('generated_at')}  ({m.get('duration_sec')}s)")
          print(f"- **وضع الطوارئ (Degraded):** {m.get('degraded_mode', False)}")
          print(f"- **القنوات:** {m.get('channels_ok')}/{m.get('channels_total')} ناجحة | **GitHub:** {m.get('github_sources_ok', m.get('github_sources'))}/{m.get('github_sources')}")
          print(f"- **جُمع:** {m.get('raw_collected')} → **فريد صالح:** {m.get('unique_clean')}")
          print(f"- **فُحص:** {m.get('tested')} → **حيّ:** {m.get('alive')}")
          print(f"- **البروتوكولات الحيّة:** {m.get('alive_by_protocol')}")
          print(f"- **الدول الأعلى:** {m.get('countries_summary', {})}")
          print(f"- **صحّة المصادر:** {m.get('source_health_summary', {})}")
          PY
          else
            echo "لا يوجد meta.json — فشلت الدورة قبل إنتاج الملفات." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to data branch (single commit, header-authenticated push)
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=/tmp/publish && rm -rf "$OUT" && mkdir -p "$OUT"
          cp -r dist/. "$OUT"/

          cat > "$OUT/README.md" <<EOF
          # bahrain-vpn v2 (@data) — مخرجات البيانات السحابية الرسمية المولّدة آليًا

          هذا الفرع (\`data\`) يتبع الإصدار الرسمي الموحّد **\`bahrain-vpn v2\`** ويُعاد بناؤه والتحقق التشفيري منه آليًا كل 30 دقيقة عبر \`.github/workflows/data.yml\` — لا تعدّله يدويًا.

          - **الإصدار الرسمي لتطبيق الأندرويد والمشرف (\`bahrain-vpn v2\` — العربية أساسية + الإنجليزية):** https://github.com/${GITHUB_REPOSITORY}/releases/tag/v2

          | الملف | الوصف الهندسي (\`v2\`) | الرابط المباشر (\`jsDelivr CDN\`) |
          |---|---|---|
          | \`top500.manifest.json\` | بيان الإصدار وبصمات SHA-256 وحالة التحديث التفاضلي لحزمة المرشّحات المركزية | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/top500.manifest.json |
          | \`top500.json\` | حزمة المرشّحات المركزية المؤهّلة (حتى 500 سيرفر بدون حشو — اختيار Top 50 محلي على أندرويد فقط) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/top500.json |
          | \`top500.delta.json\` | التحديث التفاضلي الموقّع بـ SHA-256 بين آخر إصدارين لحزمة Top 500 | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/top500.delta.json |
          | \`top500.txt\` | الروابط الخام المطبّعة لحزمة المرشّحات المركزية Top 500 | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/top500.txt |
          | \`iran-top500.json\` | قائمة السيرفرات الموثّقة مجتمعيًا من داخل شبكات إيران المباشرة (\`IR\` — تقييم متعدد الأجهزة بدون حشو) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/iran-top500.json |
          | \`iran-top500.txt\` | الروابط الخام المطبّعة لقائمة سيرفرات إيران الموثّقة مجتمعيًا (\`IR\`) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/iran-top500.txt |
          | \`iran-results.json\` | السجل التحليلي الكامل لقياسات الفحص المجتمعي الموثّق من داخل إيران (\`IR\`) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/iran-results.json |
          | \`sub.txt\` | اشتراك Base64 الشامل لجميع العُقد الحيّة بوسم \`bahrain-vpn\` | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/sub.txt |
          | \`best100.txt\` | أفضل 100 عقدة متنوّعة المضيفين والشبكات الفرعية (/24) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/best100.txt |
          | \`privacy_aware.txt\` | الأعلى أمانًا في طبقة النقل (Verified TLS/Reality فقط بدون allowInsecure) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/privacy_aware.txt |
          | \`reliable.txt\` / \`reliable_sub.txt\` | الأعلى استقرارًا واعتمادية عبر الجولات المتتالية (نصي + Base64) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/reliable_sub.txt |
          | \`low_latency.txt\` | الأقلّ زمن استجابة وتذبذبًا (Median RTT + Jitter) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/low_latency.txt |
          | \`high_throughput.txt\` | الأعلى سرعة تنزيل موثّقة عبر النفق الفعلي | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/high_throughput.txt |
          | \`alive.json\` / \`alive.txt\` | البيانات الكاملة والروابط الحيّة مع الدولة والدرجة والتقييم الأمني | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/alive.json |
          | \`servers-current.json\` | الحالة الحالية لجميع السيرفرات بهويات \`server_id\` معماة خالية من بيانات الاعتماد | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers-current.json |
          | \`servers-history.json\` | السجل التاريخي للجاهزية (24h/7d/30d/90d) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers-history.json |
          | \`servers-performance.json\` | تحليلات الأداء النافذية (avg/median/p95 للتأخير والتذبذب والسرعة) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers-performance.json |
          | \`servers-statistics.json\` | الإحصاءات الشاملة والجاهزية وفئات الأعطال الـ 10 | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/servers-statistics.json |
          | \`api/v1/statistics.json\` | واجهة الإحصاءات العامة القرائية المعماة (\`OpenAPI 3.1.0\`) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/api/v1/statistics.json |
          | \`enterprise/bundle.json\` | حزمة التراخيص الموقّعة (\`ECDSA P-256\` — \`v2\` / \`2.0\`) وعُقد VIP المشفّرة | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/enterprise/bundle.json |
          | \`promo/ads.json\` | البطاقات الترويجية الخمس الدوّارة والصور المرافقة | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/promo/ads.json |
          | \`countries.json\` | فهرس الدول المُحقّقة عبر النفق الفعلي | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/countries.json |
          | \`source_health.json\` | تقرير صحّة وتفرّد المصادر وعزلها (بدون أسرار) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/source_health.json |
          | \`all.txt.gz\` | المجمع البنيوي النظيف الكامل مضغوطًا | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/all.txt.gz |
          | \`meta.json\` | ملخص الدورة الشامل ومؤشرات الصحّة والأمان (\`v2\`) | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/meta.json |
          EOF

          cd "$OUT"
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH_B64="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH_B64}"
          git add -A
          git commit -q -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') | $(python -c "import json;print(json.load(open('meta.json'))['alive'])" 2>/dev/null || echo '?') alive"
          git push --force "https://github.com/${GITHUB_REPOSITORY}.git" data:data
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          echo "نُشر بنجاح → https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/meta.json"

      - name: Purge jsDelivr cache
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          for f in top500.manifest.json top500.delta.json top500.json top500.txt iran-top500.json iran-top500.txt iran-results.json alive.txt alive.json sub.txt best100.txt reliable.txt reliable_sub.txt low_latency.txt high_throughput.txt countries.json source_health.json meta.json enterprise/bundle.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" > /dev/null || true
          done
          echo "تم إرسال طلبات تحديث الكاش."
