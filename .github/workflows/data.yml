name: data

# كل 30 دقيقة: جمع + فحص اتصال حقيقي + نشر في فرع data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "tester.py"
      - "channels.txt"
      - "github_sources.txt"
      - "requirements.txt"
      - "server/**"
      - ".github/workflows/data.yml"

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TEST_TOP: "1200"
      CONCURRENCY: "40"
      TEST_TIMEOUT: "5"
      BEST_N: "100"
      MAX_PER_HOST: "3"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Xray & sing-box binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: engines-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data (scrape + test + publish files)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@data
        run: python server/build_data.py

      - name: Show summary
        if: always()
        run: |
          echo "### نتيجة الدورة" >> $GITHUB_STEP_SUMMARY
          if [ -f dist/meta.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          m = json.load(open("dist/meta.json"))
          print(f"- **وقت التوليد:** {m['generated_at']}  ({m['duration_sec']}s)")
          print(f"- **القنوات:** {m['channels_ok']}/{m['channels_total']} ناجحة")
          print(f"- **جُمع:** {m['raw_collected']} → **نظيف:** {m['unique_clean']}")
          print(f"- **فُحص:** {m['tested']} → **حيّ:** {m['alive']}")
          print(f"- **البروتوكولات الحيّة:** {m['alive_by_protocol']}")
          PY
          else
            echo "لا يوجد meta.json — فشلت الدورة قبل إنتاج الملفات." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish to data branch (single commit, force push)
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=/tmp/publish && rm -rf "$OUT" && mkdir -p "$OUT"
          cp -r dist/. "$OUT"/

          cat > "$OUT/README.md" <<EOF
          # data — مخرجات مولّدة آليًا

          لا تعدّل هذا الفرع يدويًا. يُعاد كتابته بالكامل كل 30 دقيقة من \`.github/workflows/data.yml\`.

          | الملف | الوصف | الرابط المباشر |
          |---|---|---|
          | \`alive.txt\` | الكانفيغات الحيّة فقط | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/alive.txt |
          | \`best100.txt\` | أفضل 100 حسب قياس الخادم | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/best100.txt |
          | \`sub.txt\` | اشتراك Base64 جاهز للعملاء | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/sub.txt |
          | \`alive.json\` | القائمة مع زمن الاستجابة والمحرّك | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/alive.json |
          | \`all.txt.gz\` | كل الكانفيغات النظيفة مضغوطة | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/all.txt.gz |
          | \`meta.json\` | وقت التوليد والأعداد | https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/meta.json |
          EOF

          cd "$OUT"
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +'%Y-%m-%dT%H:%M:%SZ') | $(python -c "import json;print(json.load(open('meta.json'))['alive'])" 2>/dev/null || echo '?') alive"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
          echo "نُشر بنجاح → https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/meta.json"

      - name: Purge jsDelivr cache
        if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          for f in alive.txt alive.json sub.txt best100.txt meta.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/$f" > /dev/null || true
          done
          echo "تم إرسال طلبات تحديث الكاش."
